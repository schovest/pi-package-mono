name: Publish to npm

on:
  push:
    branches: [main]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run test

      - name: Publish workspace packages (skip already-published versions)
        run: |
          set -e
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            private=$(node -p "require('./${dir}package.json').private || false")
            if [ "$private" = "true" ]; then
              echo "skip $name@$version (private, not published)"
              continue
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
              continue
            fi
            echo "publish $name@$version"
            npm publish --workspace "$name" --access public --provenance
          done
