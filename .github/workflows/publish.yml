name: Publish to npm

on:
  push:
    branches: [main]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run test

      - name: Publish workspace packages (OIDC trusted publishing, skip already-published versions)
        # 逐包容错：单包失败不阻断后续包，结束汇总后以非零码退出（见 scripts/publish-packages.mjs）
        run: node scripts/publish-packages.mjs
