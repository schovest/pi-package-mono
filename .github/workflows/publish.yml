name: Publish to npm

on:
  push:
    branches: [main]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run test

      - name: Publish workspace packages (skip already-published versions)
        run: |
          set -e
          set -o pipefail
          exec > >(tee publish-output.log) 2>&1
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            private=$(node -p "require('./${dir}package.json').private || false")
            if [ "$private" = "true" ]; then
              echo "skip $name@$version (private, not published)"
              continue
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
              continue
            fi
            echo "publish $name@$version"
            npm publish --workspace "$name" --access public --provenance
          done

      - name: Report publish failure (push log to ci-error-log)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .ci
          cp publish-output.log .ci/publish-error.log 2>/dev/null || echo "no log captured" > .ci/publish-error.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add .ci/publish-error.log
          git commit -m "ci: publish error log [skip ci]" || true
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-error-log
